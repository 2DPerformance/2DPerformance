<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">นายช่างใหญ่ ถอดแบบ — ภาพต้นแบบโต๊ะถอดปริมาณจาก PDF</title>
  <desc id="desc">หน้าจอต้นแบบแสดงแบบแปลน การสอบเทียบสเกลแกน X และ Y เส้นวัด พื้นที่นับ และรายการปริมาณด้านขวา</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e7eef8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08295b"/>
      <stop offset="1" stop-color="#0d4780"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cfdae8" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#08295b" flood-opacity=".14"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#08295b" flood-opacity=".12"/>
    </filter>
    <style>
      text{font-family:"Segoe UI",Tahoma,sans-serif;fill:#0b2852}
      .micro{font-size:16px;font-weight:700;letter-spacing:1.4px}
      .small{font-size:18px}
      .label{font-size:20px;font-weight:700}
      .value{font-size:22px;font-weight:800}
      .muted{fill:#64748b}
      .white{fill:#fff}
      .orange{fill:#f25a19}
      .blue{fill:#1677d2}
      .cyan{fill:#19a7bd}
      .line{fill:none;stroke:#163b68;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#7690ad;stroke-width:2}
      .dim{fill:none;stroke:#1677d2;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <rect width="1536" height="86" fill="url(#navy)"/>
  <g transform="translate(30 18)">
    <rect width="54" height="48" rx="10" fill="#fff"/>
    <path d="M10 34 18 14l9 15 7-12 10 17" fill="none" stroke="#0b3c78" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m34 17 10 17" stroke="#f25a19" stroke-width="6" stroke-linecap="round"/>
    <text x="70" y="24" class="white" font-size="25" font-weight="800">นายช่างใหญ่ ถอดแบบ</text>
    <text x="70" y="47" class="white" font-size="14" font-weight="600" opacity=".72" letter-spacing="1.5">QUANTITY TAKEOFF WORKSPACE</text>
  </g>
  <g transform="translate(1265 21)">
    <rect width="236" height="42" rx="21" fill="#fff" opacity=".12" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="24" cy="21" r="6" fill="#ff7a22"/>
    <text x="42" y="27" class="white" font-size="16" font-weight="750" letter-spacing="1">LOCAL-FIRST BETA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="28" y="110" width="254" height="864" rx="18" fill="#f7faff" stroke="#c7d4e4"/>
    <rect x="302" y="110" width="900" height="864" rx="18" fill="#edf3fa" stroke="#c7d4e4"/>
    <rect x="1222" y="110" width="286" height="864" rx="18" fill="#f7faff" stroke="#c7d4e4"/>
  </g>

  <g transform="translate(50 138)">
    <text class="micro muted">PROJECT INPUT</text>
    <text y="32" class="label">ชุดแบบ PDF</text>
    <rect y="56" width="210" height="48" rx="10" fill="#fff" stroke="#cbd7e5"/>
    <text x="18" y="87" class="small muted">ค้นหาหน้าแบบ...</text>
    <g transform="translate(0 128)" filter="url(#smallShadow)">
      <rect width="210" height="158" rx="10" fill="#fff" stroke="#1a70c9" stroke-width="3"/>
      <rect x="18" y="18" width="174" height="112" fill="url(#grid)" stroke="#b8c8da"/>
      <path d="M38 103V45h46v27h42V39h43v64M84 45h42M84 72v31m42-64v64" class="thin" stroke="#183c68" stroke-width="4"/>
      <text x="18" y="149" class="micro blue">A-102 · FLOOR PLAN</text>
    </g>
    <g transform="translate(0 308)">
      <rect width="210" height="142" rx="10" fill="#fff" stroke="#d2dce8"/>
      <rect x="18" y="18" width="174" height="88" fill="url(#grid)" stroke="#d2dce8"/>
      <path d="M40 91V38h45v53m22 0V38h60v53M40 58h45m22 15h60" class="thin" stroke="#6f839b" stroke-width="3"/>
      <text x="18" y="132" class="micro muted">A-201 · ELEVATION</text>
    </g>
    <g transform="translate(0 472)">
      <rect width="210" height="142" rx="10" fill="#fff" stroke="#d2dce8"/>
      <rect x="18" y="18" width="174" height="88" fill="url(#grid)" stroke="#d2dce8"/>
      <path d="M32 93 75 34h59l44 59M75 34v59m59-59v59M52 64h105" class="thin" stroke="#6f839b" stroke-width="3"/>
      <text x="18" y="132" class="micro muted">S-301 · SECTION</text>
    </g>
    <g transform="translate(0 652)">
      <rect width="210" height="114" rx="12" fill="#eaf2fb" stroke="#bed0e3"/>
      <text x="16" y="29" class="micro muted">LOCAL FIRST</text>
      <text x="16" y="57" class="label">3 หน้าแบบ</text>
      <text x="16" y="83" class="small muted">ไฟล์อยู่ในเครื่อง</text>
    </g>
  </g>

  <g transform="translate(326 134)">
    <text class="micro muted">DRAWING WORKSPACE</text>
    <text y="32" class="label">พื้นที่ถอดปริมาณ</text>
    <g transform="translate(16 58)" filter="url(#smallShadow)">
      <rect width="820" height="710" rx="8" fill="#fff" stroke="#c8d4e2"/>
      <rect x="26" y="28" width="768" height="650" fill="url(#grid)" opacity=".72"/>
      <text x="48" y="62" class="micro muted">A-102 · FLOOR PLAN · REV.02</text>
      <text x="648" y="62" class="micro muted">SCALE 1:100</text>

      <g transform="translate(168 114)">
        <path d="M0 0H430V390H0Z M0 158H430 M171 0V158 M292 0V390 M0 278H292" class="line"/>
        <path d="M171 44h121M58 158v120M292 96h138M82 278v112" class="thin" stroke="#385776" stroke-width="4"/>
        <path d="M171 95a38 38 0 0 1 38-38M292 226a42 42 0 0 1 42-42M82 342a34 34 0 0 1 34-34" fill="none" stroke="#385776" stroke-width="3"/>
        <text x="54" y="88" class="small muted">ห้องนอน</text>
        <text x="205" y="88" class="small muted">ห้องน้ำ</text>
        <text x="322" y="86" class="small muted">ครัว</text>
        <text x="92" y="224" class="small muted">โถง</text>
        <text x="322" y="260" class="small muted">รับประทานอาหาร</text>
        <text x="118" y="338" class="small muted">จอดรถ</text>
      </g>

      <g transform="translate(162 92)">
        <path d="M0 0V-17m436 17V-17M0-10H436" class="dim"/>
        <path d="m0-10 12-7v14Zm436 0-12-7v14Z" fill="#1677d2"/>
        <rect x="176" y="-35" width="85" height="30" rx="8" fill="#1677d2"/>
        <text x="218" y="-14" class="white" font-size="18" font-weight="800" text-anchor="middle">X 6.40 m</text>
      </g>
      <g transform="translate(144 114)">
        <path d="M0 0H-17m17 390H-17M-10 0V390" fill="none" stroke="#19a7bd" stroke-width="5" stroke-linecap="round"/>
        <path d="m-10 0-7 12h14Zm0 390-7-12h14Z" fill="#19a7bd"/>
        <g transform="translate(-26 194) rotate(-90)">
          <rect x="-44" y="-15" width="88" height="30" rx="8" fill="#19a7bd"/>
          <text y="7" class="white" font-size="18" font-weight="800" text-anchor="middle">Y 8.60 m</text>
        </g>
      </g>

      <path d="M462 385h170v154H462Z" fill="#ff6a1a" fill-opacity=".17" stroke="#f25a19" stroke-width="5" stroke-dasharray="10 7"/>
      <rect x="500" y="446" width="95" height="42" rx="9" fill="#f25a19"/>
      <text x="548" y="473" class="white" font-size="19" font-weight="800" text-anchor="middle">26.4 m²</text>

      <g fill="#0b3c78" stroke="#fff" stroke-width="4">
        <circle cx="340" cy="260" r="15"/><circle cx="404" cy="382" r="15"/><circle cx="642" cy="293" r="15"/>
      </g>
      <g class="white" font-size="16" font-weight="800" text-anchor="middle">
        <text x="340" y="266">1</text><text x="404" y="388">2</text><text x="642" y="299">3</text>
      </g>

      <g transform="translate(36 80)" filter="url(#smallShadow)">
        <rect width="272" height="122" rx="12" fill="#f8fbff" stroke="#9bb8d5"/>
        <text x="18" y="27" class="micro blue">SCALE CALIBRATION · X + Y</text>
        <rect x="18" y="43" width="112" height="56" rx="9" fill="#e8f2fd"/>
        <text x="31" y="66" class="micro muted">แกน X</text><text x="31" y="90" class="value">6.40 m</text>
        <circle cx="115" cy="58" r="8" fill="#1b9b77"/><path d="m111 58 3 3 6-7" fill="none" stroke="#fff" stroke-width="3"/>
        <rect x="142" y="43" width="112" height="56" rx="9" fill="#e9f8fa"/>
        <text x="155" y="66" class="micro muted">แกน Y</text><text x="155" y="90" class="value">8.60 m</text>
        <circle cx="239" cy="58" r="8" fill="#1b9b77"/><path d="m235 58 3 3 6-7" fill="none" stroke="#fff" stroke-width="3"/>
      </g>

      <g transform="translate(176 620)">
        <rect width="478" height="62" rx="14" fill="#fff" stroke="#bfccdc" filter="url(#smallShadow)"/>
        <g transform="translate(22 12)"><circle cx="19" cy="19" r="17" fill="#eaf3fd"/><path d="M10 24h18M13 17h12" class="thin" stroke="#1677d2" stroke-width="3"/><text x="48" y="25" class="micro">เส้น</text></g>
        <g transform="translate(128 12)"><circle cx="19" cy="19" r="17" fill="#fff0e8"/><path d="m9 26 10-17 11 17Z" fill="#f25a19" fill-opacity=".25" stroke="#f25a19" stroke-width="3"/><text x="48" y="25" class="micro">พื้นที่</text></g>
        <g transform="translate(250 12)"><circle cx="19" cy="19" r="17" fill="#eaf3fd"/><circle cx="19" cy="19" r="6" fill="#0b3c78"/><text x="48" y="25" class="micro">นับ</text></g>
        <g transform="translate(356 12)"><rect x="2" y="2" width="38" height="34" rx="9" fill="#f25a19"/><text x="21" y="26" class="white" font-size="19" font-weight="800" text-anchor="middle">↗</text><text x="52" y="25" class="micro">ส่งออก</text></g>
      </g>
    </g>
  </g>

  <g transform="translate(1246 138)">
    <text class="micro muted">TAKEOFF OUTPUT</text>
    <text y="32" class="label">รายการวัด <tspan class="blue">12</tspan></text>
    <rect y="58" width="238" height="48" rx="10" fill="#fff" stroke="#cbd7e5"/>
    <text x="16" y="88" class="small muted">ค้นหารายการ...</text>

    <g transform="translate(0 130)">
      <rect width="238" height="112" rx="12" fill="#e9f3fd" stroke="#9bbbd9"/>
      <rect width="7" height="112" rx="4" fill="#1677d2"/>
      <text x="22" y="30" class="micro blue">LENGTH</text>
      <text x="22" y="60" class="label">ผนังภายใน</text>
      <text x="22" y="90" class="value">18.40 m</text>
    </g>
    <g transform="translate(0 258)">
      <rect width="238" height="112" rx="12" fill="#fff2ea" stroke="#edbea7"/>
      <rect width="7" height="112" rx="4" fill="#f25a19"/>
      <text x="22" y="30" class="micro orange">AREA</text>
      <text x="22" y="60" class="label">พื้นที่จอดรถ</text>
      <text x="22" y="90" class="value">26.40 m²</text>
    </g>
    <g transform="translate(0 386)">
      <rect width="238" height="112" rx="12" fill="#ebf8fa" stroke="#a7d8df"/>
      <rect width="7" height="112" rx="4" fill="#19a7bd"/>
      <text x="22" y="30" class="micro cyan">COUNT</text>
      <text x="22" y="60" class="label">ประตู D1</text>
      <text x="22" y="90" class="value">3 จุด</text>
    </g>

    <g transform="translate(0 530)">
      <rect width="238" height="178" rx="14" fill="#fff" stroke="#c8d5e3"/>
      <text x="18" y="31" class="micro muted">QUANTITY SUMMARY</text>
      <path d="M18 48h202M18 90h202M18 132h202" stroke="#dbe4ee"/>
      <text x="18" y="76" class="small">ระยะรวม</text><text x="218" y="76" class="label" text-anchor="end">42.80 m</text>
      <text x="18" y="118" class="small">พื้นที่รวม</text><text x="218" y="118" class="label" text-anchor="end">64.03 m²</text>
      <text x="18" y="160" class="small">จำนวนรวม</text><text x="218" y="160" class="label" text-anchor="end">12</text>
    </g>
    <g transform="translate(0 730)">
      <rect width="238" height="74" rx="12" fill="#0b3c78"/>
      <text x="119" y="30" class="white" font-size="16" font-weight="700" text-anchor="middle">PDF → SCALE X+Y → TAKEOFF</text>
      <text x="119" y="54" class="white" font-size="15" opacity=".75" text-anchor="middle">REVIEW ONLY · SAMPLE DRAWING</text>
    </g>
  </g>
</svg>
