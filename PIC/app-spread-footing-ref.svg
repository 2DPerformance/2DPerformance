<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Spread Footing Calculation Workbench</title>
  <desc id="desc">Isometric spread footing with column, two-direction reinforcement, soil pressure arrows and calculation snapshot evidence</desc>
  <defs>
    <linearGradient id="bg" x1="68" y1="24" x2="892" y2="616" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fbff"/>
      <stop offset=".55" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#fff4ea"/>
    </linearGradient>
    <linearGradient id="top" x1="255" y1="186" x2="710" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d8e3ef"/>
    </linearGradient>
    <linearGradient id="front" x1="272" y1="345" x2="540" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9eb4cb"/>
      <stop offset="1" stop-color="#6f8da9"/>
    </linearGradient>
    <linearGradient id="side" x1="540" y1="350" x2="736" y2="448" gradientUnits="userSpaceOnUse">
