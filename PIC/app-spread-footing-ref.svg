      <text x="67" y="46" fill="#496983" font-size="14" font-weight="700">TRACEABLE INPUT → SNAPSHOT → FLOW 01–08</text>
      <text x="805" y="36" text-anchor="end" fill="#c94810" font-size="16" font-weight="800">1:1 MASTER</text>
