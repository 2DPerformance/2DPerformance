  <rect width="960" height="640" rx="36" fill="url(#bg)"/>
  <rect x="30" y="28" width="900" height="584" rx="28" fill="url(#grid)" opacity=".45"/>
  <path d="M64 498C255 430 700 431 894 506" fill="none" stroke="#b9c9d8" stroke-width="2" stroke-dasharray="8 10"/>
