<!doctype html><html lang="th"><head>
    <meta name="robots" content="noindex, nofollow, noarchive" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spreadsheet Design</title><link rel="stylesheet" href="/fonts/sarabun/sarabun.css">
<style>html,body{height:100%;margin:0}body{display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);font-family:Sarabun,Segoe UI,sans-serif;background:#fff;color:#222}iframe{width:100%;height:100%;border:0;display:block;background:#fff}.tabbar{display:flex;align-items:stretch;height:28px;background:#f3f3f3;border-top:1px solid #c8c8c8;font-size:12.5px;user-select:none}.nav{display:flex}.nav button{width:24px;border:0;background:transparent;color:#555;cursor:pointer;font-size:11px}.nav button:hover{background:#e1e1e1}.tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;border:0;border-right:1px solid #d4d4d4;background:transparent;padding:0 14px;font:inherit;color:#333;cursor:pointer;white-space:nowrap}.tabs button:hover{background:#e8e8e8}.tabs button[aria-selected=true]{background:#fff;color:#2f5b8a;font-weight:600;box-shadow:inset 0 -2px #2f5b8a;margin-top:-1px}.status{display:flex;align-items:center;gap:6px;padding:0 10px;border-left:1px solid #d4d4d4;color:#555;white-space:nowrap}.status button{border:0;background:transparent;color:#555;cursor:pointer;font:inherit;padding:0 4px}.status button:hover{color:#2f5b8a}.status .print-btn{background:#2f5b8a;color:#fff;border-radius:3px;padding:1px 12px;margin-right:6px}.status .print-btn:hover{background:#264b73;color:#fff}
</style></head><body>
<iframe id="sheet" title="ชีต"></iframe>
<div class="tabbar">
  <div class="nav"><button type="button" id="prev" aria-label="ชีตก่อนหน้า">◀</button><button type="button" id="next" aria-label="ชีตถัดไป">▶</button></div>
  <div class="tabs" role="tablist" aria-label="ชีต"><button type="button" role="tab" data-sheet="ADT-05" title="ออกแบบแปเหล็ก">แปเหล็ก</button><button type="button" role="tab" data-sheet="ADT-06" title="ออกแบบคานเหล็กจันทัน">จันทัน</button><button type="button" role="tab" data-sheet="ADT-07" title="ออกแบบคานเหล็กอกไก่">อกไก่</button><button type="button" role="tab" data-sheet="ADT-08" title="ออกแบบคานอะเสเหล็ก">อะเส</button><button type="button" role="tab" data-sheet="ADT-09" title="ออกแบบเสาคอนกรีตเสริมเหล็ก">เสา</button><button type="button" role="tab" data-sheet="ADT-10" title="ออกแบบพื้นคอนกรีตทางเดียว">พื้นทางเดียว</button><button type="button" role="tab" data-sheet="ADT-11" title="ออกแบบพื้นคอนกรีตสองทาง">พื้นสองทาง</button><button type="button" role="tab" data-sheet="ADT-12" title="ออกแบบพื้นคอนกรีตอัดแรงสำเร็จรูป">พื้นสำเร็จรูป</button><button type="button" role="tab" data-sheet="ADT-13" title="ออกแบบคานคอนกรีตเสริมเหล็ก">คาน</button><button type="button" role="tab" data-sheet="ADT-14" title="ออกแบบบันไดคอนกรีตเสริมเหล็ก">บันได</button><button type="button" role="tab" data-sheet="ADT-15" title="ออกแบบฐานรากแผ่">ฐานรากแผ่</button><button type="button" role="tab" data-sheet="ADT-16" title="ออกแบบฐานรากแผ่รวม">ฐานรากแผ่รวม</button><button type="button" role="tab" data-sheet="ADT-17" title="ออกแบบฐานรากเสาเข็ม">ฐานรากเสาเข็ม</button><button type="button" role="tab" data-sheet="Sheet1" title="วิเคราะห์คานคอนกรีตต่อเนื่อง">คานต่อเนื่อง</button></div>
  <div class="status"><button type="button" id="print" class="print-btn">พิมพ์</button><button type="button" id="plan" title="ลองดูแบบผู้ใช้ฟรี (มีลายน้ำ) หรือสมาชิก">ผู้ใช้ฟรี</button><button type="button" id="fit" aria-pressed="false">พอดีจอ</button><button type="button" id="zoomOut" aria-label="ย่อ">−</button><span id="zoomText">100%</span><button type="button" id="zoomIn" aria-label="ขยาย">+</button></div>
</div>
<script>const frame=document.getElementById("sheet"),tabs=[...document.querySelectorAll(".tabs button")],levels=[.5,.6,.7,.8,.9,1,1.1,1.25,1.5,1.75,2],query=new URLSearchParams(location.search);let mode="manual",zoom=.9,current=0,plan=query.get("plan")==="member"?"member":"free";const planButton=document.getElementById("plan");planButton.textContent=plan==="free"?"ผู้ใช้ฟรี":"สมาชิก",query.has("qa")||(planButton.hidden=!0),planButton.onclick=t=>{plan=plan==="free"?"member":"free",t.currentTarget.textContent=plan==="free"?"ผู้ใช้ฟรี":"สมาชิก",show(current)};const fitZoom=()=>{try{const t=frame.contentDocument,e=frame.contentWindow,n=[...t.querySelectorAll(".pages > .sheet")],l=parseFloat(e.getComputedStyle(n[0]).width),o=n.reduce((r,s)=>r+parseFloat(e.getComputedStyle(s).width),0)+(n.length-1)*16,c=(t.querySelector(".form-col")?.clientWidth||frame.clientWidth)-24,a=n.length>1&&c/o<.6;return t.body.classList.toggle("stack",a),Math.max(.3,Math.floor(c/(a?l:o)*100)/100)}catch{return 1}},applyZoom=()=>{mode==="auto"?zoom=Math.min(1.6,fitZoom()):mode==="fit"&&(zoom=fitZoom()),document.getElementById("zoomText").textContent=Math.round(zoom*100)+"%",document.getElementById("fit").setAttribute("aria-pressed",String(mode==="fit"));try{frame.contentDocument.documentElement.style.setProperty("--zoom",zoom)}catch{}};window.addEventListener("resize",()=>{mode!=="manual"&&applyZoom()}),document.getElementById("print").onclick=()=>{try{frame.contentWindow.focus(),frame.contentWindow.print()}catch{window.print()}},document.getElementById("fit").onclick=()=>{mode==="fit"?(mode="manual",zoom=.9):mode="fit",applyZoom()};const show=t=>{current=(t+tabs.length)%tabs.length,tabs.forEach((e,n)=>e.setAttribute("aria-selected",String(n===current))),tabs[current].scrollIntoView({inline:"nearest",block:"nearest"}),frame.src=tabs[current].dataset.sheet+"/sheet.html?embed&plan="+plan;try{history.replaceState(null,"","#"+tabs[current].dataset.sheet)}catch{}};frame.addEventListener("load",applyZoom),tabs.forEach((t,e)=>t.addEventListener("click",()=>show(e))),document.getElementById("prev").onclick=()=>show(current-1),document.getElementById("next").onclick=()=>show(current+1),document.getElementById("zoomIn").onclick=()=>{mode="manual",zoom=levels.find(t=>t>zoom+.001)??zoom,applyZoom()},document.getElementById("zoomOut").onclick=()=>{mode="manual",zoom=[...levels].reverse().find(t=>t<zoom-.001)??zoom,applyZoom()};const start=tabs.findIndex(t=>"#"+t.dataset.sheet===location.hash);show(start<0?0:start);
</script></body></html>
